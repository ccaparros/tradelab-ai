name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src apps tests connectors
      - name: Unit + contract + integration (no broker)
        run: pytest tests -q
      - name: Fast evals
        run: pytest evals -q -m fast || true
