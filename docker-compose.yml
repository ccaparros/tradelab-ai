services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tradelab
      POSTGRES_PASSWORD: tradelab
      POSTGRES_DB: tradelab
    ports:
      - "5432:5432"
    volumes:
      - tradelab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelab -d tradelab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://tradelab:tradelab@postgres:5432/tradelab
      DATA_ROOT: /data
      DEMO_MODE: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - tradelab_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run apps/ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
      DEMO_MODE: "true"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  tradelab_pg:
  tradelab_data:
