[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradelab"
version = "0.1.0"
description = "TradeLab AI — auditable quantitative research platform (research-only, no live trading)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "streamlit>=1.40.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pandera>=0.20.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
tradelab-load-demo = "tradelab.datasets.load_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradelab"]

[tool.hatch.build.targets.sdist]
include = ["src/tradelab", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "apps", "tests", "connectors"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "evals"]
pythonpath = ["src", "apps"]
markers = [
  "unit: fast unit tests",
  "integration: integration tests without live broker",
  "contract: OpenAPI contract tests",
  "fast: subset safe for CI evals",
]
addopts = "-q"
